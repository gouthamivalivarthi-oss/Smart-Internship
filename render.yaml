services:
  - type: web
    name: smart-internship-tracker
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build:frontend
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_API_KEY
        sync: false
