version: '3.8'

services:
  app:
    build: .
    container_name: smart_internship_tracker_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/smart_internship_tracker
      - JWT_SECRET=super_secret_jwt_key_smart_internship_tracker_2026
      - AI_API_KEY=
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: smart_internship_tracker_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
